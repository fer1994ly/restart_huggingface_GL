name: Restart Hugging Face Spaces

on:
  schedule:
    - cron: "*/30 * * * *"  # cada 30 minutos revisa el estado de los Spaces
  workflow_dispatch:

jobs:
  restart-space:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        space:
          - ferferefer/Glaucoma-EyeFundus-ML
          - ferferefer/retinal_age

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub pytest pyyaml

      - name: Run tests
        run: python -m pytest -q

      - name: Restart Space if down
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ matrix.space }}
        run: python scripts/keep_space_awake.py
