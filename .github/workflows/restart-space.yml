name: Restart Hugging Face Spaces

on:
  schedule:
    - cron: "*/30 * * * *"  # cada 30 minutos revisa el estado de los Spaces
  workflow_dispatch:

jobs:
  restart-spaces:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub pytest pyyaml

      - name: Run tests
        run: python -m pytest -q

      - name: Check Spaces one by one
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          status=0
          for space_id in \
            ferferefer/Glaucoma-EyeFundus-ML \
            ferferefer/retinal_age
          do
            SPACE_ID="$space_id" python scripts/keep_space_awake.py || status=1
          done
          exit "$status"
