name: Restart Hugging Face Space

on:
  schedule:
    - cron: "0 6 * * *"  # 07:00 UK durante horario de verano
  workflow_dispatch:

jobs:
  restart-space:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Restart Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              print("ERROR: el secreto HF_TOKEN no está configurado en el repo.")
              print("Ve a Settings -> Secrets and variables -> Actions -> New repository secret")
              sys.exit(1)

          api = HfApi(token=token)

          # Verifica que el token es válido y de quién es
          try:
              who = api.whoami()
              print(f"Token válido. Usuario: {who.get('name')}")
          except Exception as e:
              print(f"ERROR: el token no es válido o expiró: {e}")
              sys.exit(1)

          repo_id = "ferferefer/Glaucoma-EyeFundus-ML"
          try:
              api.restart_space(repo_id=repo_id)
              print(f"Space {repo_id} reiniciado correctamente")
          except Exception as e:
              print(f"ERROR al reiniciar {repo_id}: {e}")
              print("Revisa que: (1) el repo_id sea correcto, "
                    "(2) el token tenga permiso de WRITE, "
                    "(3) el token pertenezca a una cuenta con acceso al Space.")
              sys.exit(1)
          PY
